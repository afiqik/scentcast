<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScentCast Malaysia — E2E Test Suite Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #334155;
      margin: 0;
      padding: 32px 16px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .loading-state {
      background: #1e293b;
      color: #94a3b8;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #38bdf8;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="test-results">
      <div class="loading-state">
        <div class="spinner"></div>
        <div>Executing ScentCast E2E Test Verification Suites...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { runAllTests } from './runner.js';
    
    // Automatically trigger test run when loaded in browser
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await runAllTests();
      } catch (err) {
        document.getElementById('test-results').innerHTML = `
          <div style="background: #fef2f2; color: #b91c1c; padding: 24px; border-radius: 12px; border: 1px solid #f87171;">
            <h3 style="margin-top: 0;">Error Running Test Suite</h3>
            <pre style="font-family: monospace; white-space: pre-wrap;">${err.stack || err.message}</pre>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
