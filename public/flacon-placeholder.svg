<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Background cavity -->
  <rect width="200" height="200" rx="24" fill="url(#bg)" />
  
  <!-- Spray Atomizer Cap -->
  <rect x="86" y="32" width="28" height="22" rx="4" fill="url(#cap)" />
  <rect x="94" y="24" width="12" height="8" rx="2" fill="#94A3B8" />
  
  <!-- Neck Collar -->
  <rect x="80" y="54" width="40" height="8" rx="2" fill="#CBD5E1" />
  
  <!-- Flacon Body -->
  <rect x="58" y="62" width="84" height="106" rx="16" fill="url(#glass)" stroke="#94A3B8" stroke-width="2.5" />
  
  <!-- Liquid / Juice Interior -->
  <path d="M 64 100 Q 100 95 136 100 L 136 156 A 12 12 0 0 1 124 168 L 76 168 A 12 12 0 0 1 64 156 Z" fill="#38BDF8" fill-opacity="0.25" />
  
  <!-- Elegant Label Frame -->
  <rect x="74" y="106" width="52" height="34" rx="4" fill="#FFFFFF" fill-opacity="0.8" stroke="#CBD5E1" stroke-width="1.5" />
  <line x1="82" y1="118" x2="118" y2="118" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
  <line x1="88" y1="126" x2="112" y2="126" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
</svg>
