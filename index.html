<!DOCTYPE html>
<html lang="ms" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScentCast Malaysia • Kecerdasan Wangian Tropika</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "atmospheric-blue": "#4B7BEC",
            "sunset-amber": "#FF9F43",
            "deep-navy": "#0F172A",
            "ice-white": "#F8F9FA",
            "surface-inset": "#EFF1F5",
            "border-hairline": "rgba(15, 23, 42, 0.05)",
            "on-surface-variant": "#434653",
            "outline": "#737685",
            "outline-variant": "#c3c6d6",
            "surface-container-low": "#f2f3ff"
          },
          fontFamily: {
            headline: ["Space Grotesk", "sans-serif"],
            body: ["Outfit", "sans-serif"],
            brand: ["Plus Jakarta Sans", "sans-serif"]
          },
          maxWidth: {
            "max-width": "1200px"
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-ice-white text-deep-navy antialiased min-h-screen flex flex-col justify-between selection:bg-atmospheric-blue selection:text-white">
  <div id="app" class="flex flex-col min-h-screen"></div>

  <!-- Auth Modal Container -->
  <div id="auth-modal-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
